databases:
  - name: eduland-db
    plan: free
    databaseName: eduland_db
    user: eduland_user

services:
  - type: web
    name: eduland-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eduland-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
